version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: utec_conexion_db
    restart: always
    environment:
      POSTGRES_DB: utec_conexion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
